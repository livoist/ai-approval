# Render 部署設定（Blueprint）
# 在 Render 選 New → Blueprint，連上這個 repo，就會照這份設定建立服務
# 之後每次 push 到 main，Render 會自動重新部署

services:
  - type: web
    name: ai-approval
    runtime: node
    plan: free
    region: singapore # 免費方案可選的機房中，離台灣最近的
    autoDeployTrigger: checksPass # CI(GitHub Actions)檢查通過才會觸發部署

    # 1. 用 package.json 指定的 pnpm 版本安裝套件（--frozen-lockfile：版本跟本機完全一致）
    # 2. 打包前端：產生 apps/web/dist，後端啟動時會一起提供這些頁面
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @ai-approval/web build
    startCommand: pnpm --filter @ai-approval/server start

    # Render 用這個網址確認服務活著；回應不正常就不會切換到新版本
    healthCheckPath: /api/health

    envVars:
      - key: NODE_VERSION
        value: "22"
      # 公開 demo：啟動時放入示範資料，畫面上顯示示範環境提示
      - key: DEMO
        value: "true"
      # 資料只存在記憶體：免費方案閒置會休眠，喚醒後就是一組全新的示範資料
      - key: DB_PATH
        value: ":memory:"
      # 每天最多呼叫 Claude 幾次，用完改用模擬審查員
      - key: AI_DAILY_LIMIT
        value: "50"
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
      # API key 不寫在這裡：sync: false 代表要到 Render 的後台手動填入，不會出現在 repo 裡
      - key: ANTHROPIC_API_KEY
        sync: false
      # 選填：有填的話，檢索改用 BM25 + 向量的混合檢索；沒填就只用 BM25
      - key: VOYAGE_API_KEY
        sync: false
